name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Toolshop commit to test against (testsmith-io/practice-software-testing).
  TOOLSHOP_COMMIT: ae7caecb811dd8952c09d997e69be7cb946ecd44

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tests
        uses: actions/checkout@v7

      - name: Start Toolshop
        uses: ./.github/actions/start-toolshop
        with:
          commit: ${{ env.TOOLSHOP_COMMIT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install pip==26.2.2
          pip install --group test
          playwright install --with-deps chromium

      - name: Run tests
        timeout-minutes: 10
        run: pytest tests -v -rxX --junitxml=reports/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: reports/junit.xml

      - name: Save Toolshop logs
        if: failure()
        uses: ./.github/actions/save-toolshop-logs
